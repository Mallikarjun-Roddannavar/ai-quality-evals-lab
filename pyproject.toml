[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quality-evals"
version = "0.1.0"
description = "Modern AI Evaluation Engineering laboratory"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic==2.13.4", "streamlit==1.66.1", "mcp==2.3.0"]

[project.scripts]
lab = "ai_quality_evals.lab:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.2"]

[tool.setuptools.packages.find]
where = ["intro/src"]
include = ["ai_quality_evals*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["intro/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["intro/src"]
extend-exclude = [".cache", ".venv", "advanced"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
